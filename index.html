<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Gestionnaire de Concert</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="app.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
        <!-- À coller dans le <head> de index.html -->
        <!-- 1. Le style visuel pour le drag and drop mobile -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">

        <!-- 2. Le script principal qui contient "MobileDragDrop" -->
        <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>

        <!-- 3. L'activation de la fonction (ta fameuse ligne 18 corrigée) -->
        <script>
            window.addEventListener('DOMContentLoaded', () => {
                MobileDragDrop.polyfill({
                    holdToDrag: 250 // Ajoute un petit délai sur mobile pour différencier le scroll du drag
                });
            });
        </script>	
    </head>
	<body>
		<header>
            <h1 id="title">Gestionnaire de Concert</h1>
		</header>

		<main>
            <!-- Zone d'ajout de musiques au répertoire -->
            <!-- Zone d'ajout de musiques au répertoire dans index.html -->
            <section class="ajout-section">
                <h2>Ajouter au répertoire</h2>
                <input type="text" id="song-name-input" placeholder="Titre de la chanson">
                <input type="text" id="artist-input" placeholder="Artiste">
                <!-- Nouveaux champs -->
                <input type="text" id="singer-input" placeholder="Chanteur">
                <input type="text" id="tuning-input" placeholder="Accordage">
                <input type="text" id="duree-input" placeholder="Durée (ex: 3:45)">
                <button id="add-song-button">Ajouter au répertoire</button>
            </section>

            <!-- Les deux listes -->
            <div class="listes-container">
                
                <!-- Liste 1 : Le Répertoire global -->
                <section class="liste-section" id="zone-repertoire">
                    <h2>Répertoire global</h2>
                    <p class="instruction">Glissez les musiques d'ici vers le concert</p>
                    <ul id="repertoire-list" class="dropzone">
                        <!-- Les musiques ajoutées apparaîtront ici -->
                    </ul>
                </section>

                <!-- Liste 2 : Le Concert -->
                <!-- Dans la section zone-concert de ton fichier index.html -->
                <section class="liste-section" id="zone-concert">
                    <h2>Prochain Concert</h2>
                    <p class="instruction">Déposez les musiques ici</p>
                    <ul id="concert-list" class="dropzone">
                        <!-- Les musiques choisies apparaîtront ici -->
                    </ul>
                    <h3 id="total-duree">Durée du concert : 00:00</h3>
                    
                    <!-- NOUVEAU BOUTON -->
                    <button id="clear-concert-btn" class="btn-vider">Tout renvoyer au répertoire</button>
                    
                    <!-- Dans la section zone-concert de index.html -->
                    <button id="export-csv-btn" class="btn-exporter">📊 Exporter en tableur</button>
                </section>

            </div>
		</main>
	</body>
</html>
